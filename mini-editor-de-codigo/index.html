<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Mini editor de código</title>

    <!-- O CodeMirror 5 declara `var CodeMirror` em script clássico: precisa vir
         por tag <script>, e não por import de módulo. Fica em public/, servido
         sem processamento. -->
    <script src="/cm/lib/codemirror.js"></script>
    <script src="/cm/mode/css/css.js"></script>
    <script src="/cm/mode/xml/xml.js"></script>
    <script src="/cm/mode/javascript/javascript.js"></script>
    <script src="/cm/mode/htmlmixed/htmlmixed.js"></script>

    <link rel="stylesheet" href="/cm/lib/codemirror.css" />
    <link rel="stylesheet" href="/cm/theme/lesser-dark.css" />
  </head>
  <body>
    <div class="botoes">
      <button id="novo"><img src="/img/16x16/file_add.png" alt="" />Novo</button>
      <button id="abrir"><img src="/img/16x16/file.png" alt="" />Abrir</button>
      <button id="salvar"><img src="/img/16x16/diskette.png" alt="" />Salvar</button>
      <button id="salvar-como"><img src="/img/16x16/diskette.png" alt="" />Salvar como</button>
    </div>

    <div id="editor"></div>

    <div class="info">
      <label>Arquivo: </label><span id="titulo"></span>
      <label>Modo: </label><span id="modo"></span>
    </div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
