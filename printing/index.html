<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Printing</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      .campo { margin-bottom: 0.6rem; }
      .campo > label { display: inline-block; width: 130px; }
      #acoes { margin-top: 1rem; }
      #output-log { margin-top: 1rem; color: #333; }
    </style>
  </head>
  <body>
    <h2>Print to PDF Settings</h2>

    <div class="campo">
      <label for="layout-settings">Layout</label>
      <select id="layout-settings">
        <option selected>Portrait</option>
        <option>Landscape</option>
      </select>
    </div>

    <div class="campo">
      <label for="page-size-settings">Page size</label>
      <select id="page-size-settings">
        <option selected>A4</option>
        <option>A3</option>
        <option>Letter</option>
        <option>Legal</option>
        <option>Tabloid</option>
      </select>
    </div>

    <div class="campo">
      <label for="margin-settings">Margins</label>
      <select id="margin-settings">
        <option value="default" selected>Default</option>
        <option value="none">None</option>
        <option value="printableArea">Printable area</option>
      </select>
    </div>

    <div class="campo">
      <label for="print-background">Background</label>
      <input id="print-background" type="checkbox" />
      <span>Background graphics</span>
    </div>

    <div id="acoes">
      <button id="preview_button">Open preview</button>
      <button id="print_button">Print</button>
      <button id="save_pdf_button">Save as PDF</button>
      <button id="view_pdf_button">View PDF</button>
    </div>

    <div id="output-log"></div>

    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
