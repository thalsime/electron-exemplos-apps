<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MP3 Encoder</title>
  </head>
  <body>
    <h1>Dummy MP3 encoder</h1>
    <h2>Pick up a .wav file</h2>

    <form id="form">
      <div>
        <label for="arquivo">File:</label>
        <input id="arquivo" type="file" accept=".wav,.wave" />
      </div>
      <div>
        <label for="bitrate">Bitrate:</label>
        <input id="bitrate" type="number" value="128" min="32" max="320" step="8" />
      </div>
      <div><input type="submit" value="Encode!" /></div>
    </form>

    <div id="logs"></div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
