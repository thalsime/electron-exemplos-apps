name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Guarda da convenção `semi: always` da seção "Convenções de estilo" do README. Não
  # instala nada: o script é Node puro, e o acervo não tem dependência npm própria - um
  # guarda de estilo não é motivo para abrir essa exceção. Por isso também não há
  # `npm ci` aqui, e este é o job mais rápido do fluxo.
  verificar-estilo:
    name: Convenção de ponto e vírgula
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verificar que todo statement termina em ponto e vírgula
        run: node .github/scripts/verificar-ponto-e-virgula.mjs

  verificar-tipos:
    name: Verificação de tipos
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts pula o postinstall que baixa o binário do Electron
      # (centenas de MB). Ele não é necessário aqui: as declarações de tipo
      # (electron.d.ts) já vêm dentro do pacote publicado no npm.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar tipos de todos os exemplos
        run: npm run verificar-tipos

  # Os exemplos migrados para a stack Vite dependem de vite/client, que o
  # tsconfig da raiz não alcança. Com npm workspaces existe um único
  # package-lock.json, na raiz, então a instalação acontece uma vez e a
  # verificação roda dentro de cada workspace.
  verificar-projetos-vite:
    name: Verificação de tipos dos projetos Vite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        projeto:
          - camera
          - certificado-cliente
          - cookies
          - relatorio-de-falha
          - captura-de-tela
          - gravador-de-tela
          - explorador-de-arquivos
          - icone-do-aplicativo
          - janela-sem-moldura
          - ola-mundo
          - ola-mundo-objeto-compartilhado
          - menus
          - mini-editor-de-codigo
          - navegador-com-sessao
          - codificador-mp3
          - console-e-registros
          - comunicacao-entre-janelas
          - compactador-de-pasta
          - notificacoes
          - bloco-de-notas
          - bloqueio-de-suspensao
          - painel-flutuante
          - impressao
          - service-worker/resposta-simulada
          - sqlite
          - telas-no-mesmo-renderizador
          - corretor-ortografico
          - bandeja
          - webgl
          - webview/navegador

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts pula o download do binário do Electron, desnecessário
      # para checagem de tipos: as declarações vêm dentro do pacote npm.
      - name: Instalar dependências de todos os workspaces
        run: npm ci --ignore-scripts

      - name: Verificar tipos
        run: npx tsc --noEmit
        working-directory: ${{ matrix.projeto }}
