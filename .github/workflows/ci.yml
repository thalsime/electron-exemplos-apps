name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar-tipos:
    name: Verificação de tipos
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts pula o postinstall que baixa o binário do Electron
      # (centenas de MB). Ele não é necessário aqui: as declarações de tipo
      # (electron.d.ts) já vêm dentro do pacote publicado no npm.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar tipos de todos os exemplos
        run: npm run verificar-tipos

  # Os exemplos migrados para a stack Vite da turma têm dependências próprias e
  # dependem de vite/client, então não podem ser verificados com o node_modules
  # da raiz. Cada um é checado dentro do seu próprio diretório.
  verificar-projetos-vite:
    name: Verificação de tipos dos projetos Vite
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        projeto:
          - camera
          - notifications
          - helloworld-sharedobj
          - frameless-window

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci --ignore-scripts
        working-directory: ${{ matrix.projeto }}

      - name: Verificar tipos
        run: npx tsc --noEmit
        working-directory: ${{ matrix.projeto }}
