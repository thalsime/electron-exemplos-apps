<!DOCTYPE HTML>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Notificações</title>
  </head>
  <body>
    <h1>Notificações</h1>
    <p>
      Este exemplo demonstra o uso da API de notificações. Use os botões abaixo para disparar
      notificações de tipos diferentes.
    </p>
    <div class="exemplo">
      <button id="basica">Notificação simples</button>
      <span>Ícone padrão, título e mensagem.</span>
    </div>
    <div class="exemplo">
      <button id="com-imagem">Notificação com imagem</button>
      <span>Ícone, título, imagem e mensagem. A imagem só aparece no macOS.</span>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
