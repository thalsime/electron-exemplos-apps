<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Menus</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; }
      .area { padding: 2rem; border-bottom: 1px solid #ccc; min-height: 5rem; }
      #saida { padding: 1rem 2rem; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="area" id="area-1">
      Clique com o botão direito aqui: menu com item, caixa de seleção e submenu.
    </div>
    <div class="area" id="area-2">
      Clique com o botão direito aqui: escolha uma fruta. O menu lembra a escolha.
    </div>
    <div class="area" id="area-3">
      Clique com o botão direito aqui: escolha uma cor para o fundo desta área.
    </div>
    <div id="saida"></div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
